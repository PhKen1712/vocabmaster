name: iOS unsigned IPA (free Apple ID)

# Build một .ipa KHÔNG ký trên macOS runner của GitHub, để tải về Windows và ký
# bằng Apple ID miễn phí qua Sideloadly. Không cần tài khoản Apple trả phí,
# không cần Mac.
#
# Vì Apple ID miễn phí không có App Groups, workflow bỏ plugin expo-widgets
# (widget extension) trước khi prebuild. Toàn bộ code widget vẫn nằm trong repo.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Verify typecheck and unit tests
        run: |
          set -euo pipefail
          npm run typecheck
          npm run check:migrations
          npm test -- --ci

      - name: Strip widget extension (free Apple ID has no App Groups)
        run: node scripts/prepare-free-build.mjs

      - name: Show Xcode and CocoaPods versions
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          pod --version

      - name: Prebuild iOS project
        run: |
          set -euo pipefail
          npx expo prebuild --platform ios --clean --no-install
          ls -la ios

      - name: Install CocoaPods
        run: |
          set -euo pipefail
          cd ios
          pod install --repo-update

      - name: Archive unsigned app
        run: |
          set -euo pipefail
          WORKSPACE="$(ls -d ios/*.xcworkspace | head -n 1)"
          echo "Workspace: $WORKSPACE"

          # Tên scheme của app lấy từ chính project, KHÔNG đoán theo thứ tự danh sách.
          # Workspace CocoaPods sinh ra hàng trăm scheme thư viện (boost, Yoga,
          # React, ...) xếp alphabet trước scheme app, nên "scheme đầu tiên không
          # phải Pods-*" sẽ archive nhầm một thư viện và không tạo ra .app nào.
          PROJECT_DIR="$(ls -d ios/*.xcodeproj | head -n 1)"
          APP_SCHEME="$(basename "$PROJECT_DIR" .xcodeproj)"
          echo "Project: $PROJECT_DIR"
          echo "App scheme: $APP_SCHEME"

          SCHEME_LIST="$(xcodebuild -list -workspace "$WORKSPACE")" || true
          printf '%s\n' "$SCHEME_LIST"
          # xcodebuild in scheme có thụt lề, nên phải cắt khoảng trắng trước khi so khớp.
          if ! printf '%s\n' "$SCHEME_LIST" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' | grep -qx "$APP_SCHEME"; then
            echo "Không thấy scheme '$APP_SCHEME' trong workspace: $WORKSPACE" >&2
            exit 1
          fi
          SCHEME="$APP_SCHEME"
          echo "Scheme: $SCHEME"

          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/VocabMaster.xcarchive" \
            -derivedDataPath "$PWD/build/DerivedData" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          echo "--- nội dung build/ sau archive ---"
          ls -la build
          find build -maxdepth 3 -name '*.xcarchive' -print

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          # Tìm .app trong bất kỳ .xcarchive nào thay vì tin vào một đường dẫn cố định.
          APP_PATH="$(find build -type d -name '*.app' -path '*/Products/Applications/*' | head -n 1 || true)"
          echo "App: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "Không thấy .app trong archive. Nội dung build/:" >&2
            find build -maxdepth 4 -print >&2 || true
            exit 1
          fi

          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/

          (
            cd build/ipa
            /usr/bin/zip -qry "$GITHUB_WORKSPACE/VocabMaster-unsigned.ipa" Payload
          )

          ls -lh VocabMaster-unsigned.ipa
          # Chỉ để in ra log: không được làm fail job nếu defaults không đọc được.
          defaults read "$PWD/$APP_PATH/Info" CFBundleIdentifier || echo "(không đọc được CFBundleIdentifier)"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VocabMaster-unsigned-ipa
          path: VocabMaster-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
